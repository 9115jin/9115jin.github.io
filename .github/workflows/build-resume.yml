
name: Build LaTeX resume

on:
  push:
    branches: [ main ]
    paths:
      - 'resume.tex'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_lualatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          extra_system_packages: >-
            make
          continue_on_error: false

      - name: Ensure output name
        run: |
          if [ -f resume.pdf ]; then
            echo "PDF already named resume.pdf"
          else
            # latex-action outputs the same name as the root_file without change
            echo "Renaming output to resume.pdf (noop if already correct)"
          fi

      - name: Upload artifact (for quick download from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf

      - name: Commit built PDF back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "chore: auto-build resume.pdf" || echo "No changes to commit"
          git push
